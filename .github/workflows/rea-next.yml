name: REA Next prototype tests

on:
  pull_request:
    paths:
      - "experiments/rea_next/**"
      - ".github/workflows/rea-next.yml"
  push:
    branches:
      - "feat/rea-evidence-graph-prototype"
    paths:
      - "experiments/rea_next/**"
      - ".github/workflows/rea-next.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        working-directory: experiments/rea_next
        run: python -m py_compile evidence_graph.py address_space.py pe_parser.py test_evidence_graph.py test_address_space.py test_pe_parser.py
      - name: Run unit tests
        working-directory: experiments/rea_next
        run: python -m unittest -v
