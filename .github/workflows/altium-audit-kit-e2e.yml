name: altium-audit-kit-e2e

on:
  push:
    paths:
      - "audit-input/**"
      - "tools/altium-audit/**"
      - "tests/**"
      - ".github/workflows/altium-audit-kit-e2e.yml"
  workflow_dispatch:

jobs:
  kit-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audit parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/altium-audit/requirements.txt
      - name: Run contract tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run reusable audit kit
        shell: bash
        run: |
          set +e
          python tools/altium-audit/audit_kit.py --input audit-input --output work/kit --repair --max-retries 3
          rc=$?
          printf '%s\n' "$rc" > work/kit/kit_exit_code.txt
          echo "KIT EXIT: $rc"
          exit 0
      - name: Run clean-room renamed-input E2E
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work/clean-room-input work/clean-room
          mkdir -p work/clean-room-input
          cp audit-input/*.SchDoc work/clean-room-input/CLEANROOM_SCHEMATIC.SchDoc
          cp audit-input/*.PcbDoc work/clean-room-input/CLEANROOM_BOARD.PcbDoc
          if compgen -G 'audit-input/*.PrjPcb' > /dev/null; then cp audit-input/*.PrjPcb work/clean-room-input/CLEANROOM_PROJECT.PrjPcb; fi
          set +e
          python tools/altium-audit/audit_kit.py --input work/clean-room-input --output work/clean-room
          rc=$?
          set -e
          printf '%s\n' "$rc" > work/clean-room/kit_exit_code.txt
          test -s work/clean-room/intake.json
          test -s work/clean-room/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          intake=json.loads(Path('work/clean-room/intake.json').read_text())
          result=json.loads(Path('work/clean-room/summary.json').read_text())
          assert intake['input']['schematic'] == 'CLEANROOM_SCHEMATIC.SchDoc'
          assert intake['input']['pcb'] == 'CLEANROOM_BOARD.PcbDoc'
          assert result.get('terminal_status') in {'PASS','FAIL','BLOCKED','INCONCLUSIVE','UNKNOWN'}
          print('CLEAN ROOM TERMINAL:', result.get('terminal_status'))
          PY
      - name: Validate kit terminal artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -s work/kit/intake.json
          test -s work/kit/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          intake=json.loads(Path('work/kit/intake.json').read_text())
          s=json.loads(Path('work/kit/summary.json').read_text())
          print('INPUT:', intake['input'])
          print('FINAL STATUS:', s.get('status'))
          print('TERMINAL STATUS:', s.get('terminal_status'))
          print('GATES:', s.get('gates'))
          print('PROJECT FALLBACK:', s.get('project_compile_fallback', False))
          if s.get('terminal_status') not in ('PASS','FAIL','BLOCKED','INCONCLUSIVE','UNKNOWN'): raise SystemExit('invalid terminal status')
          if s.get('project_compile_fallback') and not any(f.get('id')=='G2-PROJECT-COMPILE' for f in s.get('findings',[])): raise SystemExit('project fallback missing blocker evidence')
          PY
      - name: Upload kit result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: altium-audit-kit-e2e
          path: work
          if-no-files-found: error
