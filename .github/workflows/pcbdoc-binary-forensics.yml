name: pcbdoc-binary-forensics

on:
  push:
    branches:
      - "feat/pcbdoc-binary-forensics"
    paths:
      - "tools/altium-audit/pcbdoc-forensics/**"
      - "tests/test_pcbdoc_forensics.py"
      - ".github/workflows/pcbdoc-binary-forensics.yml"
  pull_request:
    paths:
      - "tools/altium-audit/pcbdoc-forensics/**"
      - "tests/test_pcbdoc_forensics.py"
      - ".github/workflows/pcbdoc-binary-forensics.yml"
  workflow_dispatch:

jobs:
  forensics-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated forensics dependency
        run: python -m pip install -r tools/altium-audit/pcbdoc-forensics/requirements.txt
      - name: Verify olefile is installed in the active interpreter
        run: python -c "import sys, olefile; print(sys.executable); print('olefile', getattr(olefile, '__version__', 'installed'))"
      - name: Run PcbDoc forensics regression tests
        run: python -m unittest discover -s tests -p 'test_pcbdoc_forensics.py' -v
      - name: Compile forensics scripts
        run: python -m py_compile tools/altium-audit/pcbdoc-forensics/explore_format.py tools/altium-audit/pcbdoc-forensics/dump_raw.py
