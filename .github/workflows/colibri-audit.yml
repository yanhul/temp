name: Colibri downloader audit
on:
  workflow_dispatch:
  push:
    branches: [audit/colibri-download-integrity]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  downloader-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JustVugg/colibri
          ref: bf2442915d6e3dd4cdfd2eb9c2a3d2aa44a25850
          path: colibri
      - name: Verify upstream source baseline
        run: test "$(git -C colibri rev-parse HEAD)" = "bf2442915d6e3dd4cdfd2eb9c2a3d2aa44a25850"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Existing downloader test suite on pristine upstream
        run: python -m unittest discover -s colibri/c/tests -p 'test_setup_download.py' -v
      - name: Existing setup-flow test suite on pristine upstream
        run: python -m unittest discover -s colibri/c/tests -p 'test_setup_flow.py' -v
      - name: Apply candidate integrity patch to isolated Colibri checkout
        run: python patches/colibri/apply_integrity_patch.py
      - name: Syntax-check patched downloader and setup flow
        run: python -m py_compile colibri/c/setup_download.py colibri/c/setup_flow.py
      - name: Existing downloader suite against patched candidate
        run: python -m unittest discover -s colibri/c/tests -p 'test_setup_download.py' -v
      - name: Existing setup-flow suite against patched candidate
        run: python -m unittest discover -s colibri/c/tests -p 'test_setup_flow.py' -v
      - name: Strict integrity regression tests against patched candidate
        run: python -m unittest discover -s tests/colibri-audit -p 'test_*.py' -v
