name: altium-audit

on:
  push:
    paths:
      - "b64parts/**"
      - "*.zip"
      - "altium-audit.config.json"
      - ".github/workflows/altium-audit.yml"
      - "tools/altium-audit/**"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and verify immutable source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/project work/audit
          python tools/altium-audit/reconstruct_source.py \
            --config altium-audit.config.json \
            --archive work/project.zip \
            --sha256 work/source.sha256 \
            --provenance work/source-provenance.json \
            --commit-sha "$GITHUB_SHA"
          unzip -q work/project.zip -d work/project
          cp work/source-provenance.json work/audit/source-provenance.json

      - name: Install audit parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/altium-audit/requirements.txt

      - name: Render QI9-2605-A01 source PCB for visual geometry audit
        run: python tools/altium-audit/render_pcb_geometry.py audit-input-2605/QI9-2605-A01.PcbDoc --out work/pcb-render

      - name: Upload source PCB render
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-board-render
          path: work/pcb-render/
          if-no-files-found: error

      - name: Verify project-independent audit engine
        run: python tests/test_altium_audit_project_independence.py

      - name: Execute audit repair verify retry contract
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          PCB="$(find work/project -type f -name '*.PcbDoc' | head -1)"
          python tools/altium-audit/execution_contract.py \
            --out work/audit \
            --max-attempts 3 \
            --topology-cmd "python tools/altium-audit/placement_routing_plan.py --pcb $PCB --out work/audit/placement-routing-plan.json --findings work/audit/findings.json --config altium-audit.config.json" \
            --audit-cmd "python tools/altium-audit/audit_runner.py --root work/project --out work/audit --archive work/project.zip --source-sha256 $(cat work/source.sha256) --config altium-audit.config.json" \
            --plan-cmd "python tools/altium-audit/routing_repair_plan.py --pcb $PCB --out work/audit/routing_repair_plan.json" \
            --authorize-cmd "python tools/altium-audit/routing_repair_authorize.py --pcb $PCB --plan work/audit/routing_repair_plan.json --findings work/audit/findings.json --probe work/audit/g4_probe.json" \
            --repair-cmd "python tools/altium-audit/routing_repair_apply.py --pcb $PCB --plan work/audit/routing_repair_plan.json --out work/audit/repaired.PcbDoc --receipt work/audit/repair_receipt.json"
          rc=$?
          printf '%s\n' "$rc" > work/audit/execution_contract_exit_code.txt
          echo "execution contract exit: $rc"

      - name: Validate required audit artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          for f in summary.json netlist.json design.json pcb_probe.txt g4_probe.json findings.json report.md placement-routing-plan.json execution_result.json execution_contract_exit_code.txt; do
            test -s "work/audit/$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("work/audit/summary.json").read_text())
          required={"G0_INTAKE","G1_PARSE","G2_COMPILE","G3_CONNECTIVITY","G4_PCB","G5_ELECTRICAL","G6_PHYSICAL","G6_PLACEMENT","G7_ROUTING","G7_FUNCTIONAL","G8_REPORT"}
          missing=required-set(s.get("gates",{}))
          if missing: raise SystemExit(f"missing gates: {sorted(missing)}")
          e=json.loads(Path("work/audit/execution_result.json").read_text())
          status=e.get("status")
          if status not in ("PASS","BLOCKED","UNRESOLVED"): raise SystemExit("invalid execution terminal status")
          if status=="PASS":
              for f in ("routing_repair_plan.json","repair_receipt.json"):
                  if not Path("work/audit",f).is_file(): raise SystemExit(f"missing PASS artifact: {f}")
          print("AUDIT STATUS:",s.get("status"))
          plan=json.loads(Path("work/audit/placement-routing-plan.json").read_text())
          if plan.get("industrial_rule_authority",{}).get("status")!="VERIFIED":
              print("INDUSTRIAL RULE AUTHORITY:", plan.get("industrial_rule_authority",{}).get("status"))
          print("FINAL EXECUTION STATUS:",status)
          PY

      - name: Upload audit artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: altium-audit-report
          path: work/audit/
          if-no-files-found: error

      - name: Finalize audit status
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          e=json.loads(Path("work/audit/execution_result.json").read_text())
          status=e.get("status")
          print("FINAL DESIGN STATUS:",status)
          if status=="UNRESOLVED": raise SystemExit("repair/retry budget exhausted without terminal PASS or safety BLOCK")
          if status not in ("PASS","BLOCKED"): raise SystemExit(f"invalid terminal status: {status}")
          PY

# strict-evidence-engine v4
# independent-routing-authorization
# execution-contract-runtime
