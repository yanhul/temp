name: altium-audit

on:
  push:
    paths:
      - "b64parts/**"
      - "*.zip"
      - "altium-audit.config.json"
      - ".github/workflows/altium-audit.yml"
      - "tools/altium-audit/**"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct archive from ordered base64 parts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work/project work/audit
          test -n "$(find b64parts -maxdepth 1 -name 'part_*.txt' -print -quit)"
          cat $(find b64parts -maxdepth 1 -name 'part_*.txt' | sort) | base64 -d > work/project.zip
          test -s work/project.zip
          unzip -q work/project.zip -d work/project
          ARCHIVE=$(python -c 'import json; print(json.load(open("altium-audit.config.json"))["source_archive"])')
          test -s "$ARCHIVE"
          sha256sum "$ARCHIVE" | awk '{print $1}' > work/source.sha256
          echo "reference archive sha256: $(cat work/source.sha256)"
          echo "reconstructed archive sha256: $(sha256sum work/project.zip | awk '{print $1}')"
          cmp -s "$ARCHIVE" work/project.zip

      - name: Install audit parser
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tools/altium-audit/requirements.txt

      - name: Verify project-independent audit engine
        run: python tests/test_altium_audit_project_independence.py

      - name: Run evidence-first audit
        shell: bash
        run: |
          set +e
          python tools/altium-audit/audit_runner.py \
            --root work/project \
            --out work/audit \
            --archive work/project.zip \
            --source-sha256 "$(cat work/source.sha256)" \
            --config altium-audit.config.json
          rc=$?
          printf '%s\n' "$rc" > work/audit/runner_exit_code.txt
          printf '%s\n' "audit_runner_exit_code=$rc" > work/audit/runner_exit.txt
          echo "audit_runner exit code: $rc"
          exit 0

      - name: Validate required audit artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          for f in summary.json netlist.json design.json pcb_probe.txt g4_probe.json findings.json report.md; do
            test -s "work/audit/$f"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("work/audit/summary.json").read_text())
          required={"G0_INTAKE","G1_PARSE","G2_COMPILE","G3_CONNECTIVITY","G4_PCB","G5_ELECTRICAL","G6_PHYSICAL","G6_PLACEMENT","G7_ROUTING","G7_FUNCTIONAL","G8_REPORT"}
          missing=required-set(s.get("gates",{}))
          if missing:
              raise SystemExit(f"missing gates: {sorted(missing)}")
          print("audit status:",s.get("status"))
          print("gates:",s.get("gates"))
          PY

      - name: Upload audit artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: altium-audit-report
          path: |
            work/audit/summary.json
            work/audit/design.json
            work/audit/netlist.json
            work/audit/pcb_probe.txt
            work/audit/g4_probe.json
            work/audit/findings.json
            work/audit/report.md
            work/audit/runner_exit.txt
            work/audit/runner_exit_code.txt
          if-no-files-found: error

      - name: Finalize audit status
        if: ${{ always() }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path("work/audit/summary.json").read_text())
          status=s.get("status")
          print("final audit status:", status)
          if status != "PASS":
              raise SystemExit(f"strict audit not PASS: {status}")
          PY

# trigger: audit-run
# strict-evidence-engine v3-project-independent
