name: qi9-2605-pr-verification

on:
  pull_request:
    paths:
      - 'audit-input-2605/**'
      - 'tools/altium-audit/**'
      - 'altium-audit-2605.config.json'
      - 'altium-audit-2605.placement-authority.json'
      - 'tests/**'
      - '.github/workflows/qi9-2605-pr-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r tools/altium-audit/requirements.txt
      - name: Semantic and phase-policy regression tests
        run: python -m pytest -q tests/test_schematic_semantics.py tests/test_e2e_phase_policy.py
      - name: QI9-2605 schematic-only E2E
        shell: bash
        run: |
          set +e
          python tools/altium-audit/e2e_phase.py --phase schematic --input audit-input-2605 --output work-2605/schematic --config altium-audit-2605.config.json
          rc=$?
          set -e
          python - "work-2605/schematic/phase_receipt.json" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          path, raw_rc = Path(sys.argv[1]), int(sys.argv[2])
          if not path.is_file():
              raise SystemExit(f"missing schematic phase receipt: {path}")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          if receipt.get("schema") != "altium-audit-e2e-phase/v2" or receipt.get("phase") != "SCHEMATIC":
              raise SystemExit("invalid schematic phase receipt schema/phase")
          status = receipt.get("status")
          if status not in {"PASS", "BLOCKED"}:
              raise SystemExit(f"unauthorized schematic status: {status!r}")
          if (status == "PASS" and raw_rc != 0) or (status == "BLOCKED" and raw_rc == 0):
              raise SystemExit(f"receipt/exit mismatch: status={status} rc={raw_rc}")
          if status == "PASS":
              gates = receipt.get("evidence", {}).get("required_gates", {})
              if any(gates.get(k) != "VERIFIED" for k in ("G0_INTAKE", "G1_PARSE", "G2_COMPILE", "G3_CONNECTIVITY")):
                  raise SystemExit("PASS receipt lacks verified G0-G3 gates")
              if receipt.get("evidence", {}).get("required_unknown_findings"):
                  raise SystemExit("PASS receipt contains unresolved required schematic findings")
              print("SCHEMATIC_E2E_CONFORMANCE_PASS; DESIGN_STATUS=PASS")
          else:
              print("SCHEMATIC_E2E_CONFORMANCE_PASS; DESIGN_STATUS=BLOCKED")
              print(json.dumps(receipt.get("evidence", {}).get("required_unknown_findings", []), sort_keys=True))
          PY
      - name: Upload QI9-2605 schematic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-pr-schematic-evidence
          path: work-2605/schematic
          if-no-files-found: error
          retention-days: 90
