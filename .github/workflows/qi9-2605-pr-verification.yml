name: qi9-2605-pr-verification

on:
  pull_request:
    paths:
      - 'audit-input-2605/**'
      - 'tools/altium-audit/**'
      - 'altium-audit-2605.config.json'
      - 'altium-audit-2605.placement-authority.json'
      - 'tests/**'
      - '.github/workflows/qi9-2605-pr-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r tools/altium-audit/requirements.txt
      - name: Semantic and phase-policy regression tests
        run: python -m pytest -q tests/test_part_identity.py tests/test_schematic_semantics.py tests/test_e2e_phase_policy.py
      - name: QI9-2605 schematic-only E2E
        shell: bash
        run: |
          set +e
          python tools/altium-audit/e2e_phase.py --phase schematic --input audit-input-2605 --output work-2605/schematic --config altium-audit-2605.config.json
          rc=$?
          set -e
          python - "work-2605/schematic/phase_receipt.json" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          path, raw_rc = Path(sys.argv[1]), int(sys.argv[2])
          if not path.is_file():
              raise SystemExit(f"missing schematic phase receipt: {path}")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          if receipt.get("schema") != "altium-audit-e2e-phase/v2" or receipt.get("phase") != "SCHEMATIC":
              raise SystemExit("invalid schematic phase receipt schema/phase")
          status = receipt.get("status")
          if status not in {"PASS", "BLOCKED"}:
              raise SystemExit(f"unauthorized schematic status: {status!r}")
          if (status == "PASS" and raw_rc != 0) or (status == "BLOCKED" and raw_rc == 0):
              raise SystemExit(f"receipt/exit mismatch: status={status} rc={raw_rc}")
          if status == "PASS":
              gates = receipt.get("evidence", {}).get("required_gates", {})
              if any(gates.get(k) != "VERIFIED" for k in ("G0_INTAKE", "G1_PARSE", "G2_COMPILE", "G3_CONNECTIVITY")):
                  raise SystemExit("PASS receipt lacks verified G0-G3 gates")
              if receipt.get("evidence", {}).get("required_unknown_findings"):
                  raise SystemExit("PASS receipt contains unresolved required schematic findings")
              print("SCHEMATIC_E2E_CONFORMANCE_PASS; DESIGN_STATUS=PASS")
          else:
              print("SCHEMATIC_E2E_CONFORMANCE_PASS; DESIGN_STATUS=BLOCKED")
              print(json.dumps(receipt.get("evidence", {}).get("required_unknown_findings", []), sort_keys=True))
          PY
      - name: Assemble required PR schematic receipt evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s work-2605/schematic/phase_receipt.json
          mkdir -p work-2605/pr-schematic-evidence
          cp work-2605/schematic/phase_receipt.json work-2605/pr-schematic-evidence/
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("work-2605/pr-schematic-evidence")
          p = root / "phase_receipt.json"
          manifest = {
              "schema": "qi9-pr-schematic-evidence-manifest/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "files": {"phase_receipt.json": {
                  "bytes": p.stat().st_size,
                  "sha256": hashlib.sha256(p.read_bytes()).hexdigest()
              }}
          }
          (root / "evidence-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          receipt = json.loads(p.read_text(encoding="utf-8"))
          summary = [
              "## QI9 PR schematic receipt evidence",
              "",
              f"- Commit: `{manifest['commit_sha']}`",
              f"- Run: `{manifest['workflow_run_id']}` (attempt `{manifest['workflow_run_attempt']}`)",
              f"- Design status: **{receipt.get('status')}**",
              "- Receipt is evidence only; BLOCKED design status is not converted into PASS."
          ]
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY
      - name: Upload required PR schematic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-pr-schematic-evidence
          path: work-2605/pr-schematic-evidence/
          if-no-files-found: error
          retention-days: 3
      - name: Download and verify PR schematic evidence
        if: success()()
        uses: actions/download-artifact@v4
        with:
          name: qi9-2605-pr-schematic-evidence
          path: work-2605/pr-schematic-evidence-roundtrip
      - name: Verify PR schematic artifact lineage and hashes
        if: success()()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("work-2605/pr-schematic-evidence-roundtrip")
          manifest = json.loads((root / "evidence-manifest.json").read_text(encoding="utf-8"))
          expected_lineage = {
              "schema": "qi9-pr-schematic-evidence-manifest/v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "workflow_run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
          }
          for key, value in expected_lineage.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"BLOCKED: PR schematic artifact lineage/schema mismatch: {key}")
          required = {"phase_receipt.json"}
          if set(manifest.get("files", {})) != required:
              raise SystemExit("BLOCKED: PR schematic artifact manifest file set mismatch")
          actual = {p.name for p in root.iterdir() if p.is_file()} - {"evidence-manifest.json"}
          if actual != required:
              raise SystemExit("BLOCKED: unexpected or missing PR schematic artifact files")
          for name, expected in manifest["files"].items():
              p = root / name
              if not p.is_file() or p.stat().st_size != expected["bytes"]:
                  raise SystemExit(f"BLOCKED: PR schematic evidence missing/size mismatch: {name}")
              if hashlib.sha256(p.read_bytes()).hexdigest() != expected["sha256"]:
                  raise SystemExit(f"BLOCKED: PR schematic evidence hash mismatch: {name}")
          print("PR_SCHEMATIC_ARTIFACT_UPLOAD_ROUNDTRIP_LINEAGE_SHA256_VERIFIED")
          PY
