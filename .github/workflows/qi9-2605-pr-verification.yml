name: qi9-2605-pr-verification

on:
  pull_request:
    paths:
      - 'audit-input-2605/**'
      - 'tools/altium-audit/**'
      - 'altium-audit-2605.config.json'
      - 'altium-audit-2605.placement-authority.json'
      - 'tests/**'
      - '.github/workflows/qi9-2605-pr-verification.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r tools/altium-audit/requirements.txt
      - name: Semantic regression tests
        run: python -m pytest -q tests/test_schematic_semantics.py tests/test_e2e_phase_policy.py
      - name: QI9-2605 E2E
        run: |
          set +e
          python tools/altium-audit/audit_kit.py --input audit-input-2605 --output work-2605/kit --config altium-audit-2605.config.json --repair --max-retries 3
          rc=$?
          echo "audit_rc=$rc"
          cat work-2605/kit/summary.json || true
          cat work-2605/kit/placement-routing-plan.json || true
          cat work-2605/kit/anchor-first-placement-plan.json || true
          exit $rc
      - name: Upload QI9-2605 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-pr-evidence
          path: work-2605/kit
          if-no-files-found: warn
