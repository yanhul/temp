name: qi9-2605-three-phase-e2e
on:
  workflow_dispatch:
  push:
    paths:
      - 'audit-input-2605/**'
      - 'tools/altium-audit/**'
      - 'altium-audit-2605.config.json'
      - '.github/workflows/qi9-2605-three-phase-e2e.yml'
jobs:
  schematic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r tools/altium-audit/requirements.txt
      - run: python tools/altium-audit/e2e_phase.py --phase schematic --input audit-input-2605 --output e2e/schematic --config altium-audit-2605.config.json
      - uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-e2e-schematic
          path: e2e/schematic
  placement:
    needs: schematic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r tools/altium-audit/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: qi9-2605-e2e-schematic
          path: e2e/schematic
      - run: python tools/altium-audit/e2e_phase.py --phase placement --input audit-input-2605 --output e2e/placement --config altium-audit-2605.config.json --upstream-receipt e2e/schematic/phase_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-e2e-placement
          path: e2e/placement
  routing:
    needs: placement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r tools/altium-audit/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: qi9-2605-e2e-placement
          path: e2e/placement
      - run: python tools/altium-audit/e2e_phase.py --phase routing --input audit-input-2605 --output e2e/routing --config altium-audit-2605.config.json --upstream-receipt e2e/placement/phase_receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-e2e-routing
          path: e2e/routing
