name: qi9-native-workflow-diagnostic

on:
  push:
    paths:
      - '.github/workflows/qi9-native-workflow-diagnostic.yml'
      - '.github/workflows/qi9-2605-pdf-backend-one-pass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-native-workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Validate native workflow syntax and expressions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest .github/workflows/qi9-2605-pdf-backend-one-pass.yml
