# Re-run the 2605 audit against the current authoritative input set (2026-10-29).
name: qi9-2605-schematic-gate-conformance

on:
  push:
    paths:
      - 'audit-input-2605/**'
      - 'tools/altium-audit/**'
      - 'tools/pdf-schematic/**'
      - 'altium-audit-2605.config.json'
      - '.github/workflows/qi9-2605-schematic-routing.yml'
  pull_request:
    paths:
      - 'audit-input-2605/**'
      - 'tools/altium-audit/**'
      - 'altium-audit-2605.config.json'
      - 'altium-audit-2605.placement-authority.json'
      - 'tools/pdf-schematic/**'
      - 'tests/**'
      - '.github/workflows/qi9-2605-schematic-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schematic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r tools/altium-audit/requirements.txt
      - run: python -m pip install pytest
      - name: Semantic and phase-policy regression tests
        run: python -m pytest -q tests/test_part_identity.py tests/test_schematic_semantics.py tests/test_e2e_phase_policy.py
      - name: Run schematic phase and classify truthful design status
        shell: bash
        run: |
          set +e
          python tools/altium-audit/e2e_phase.py --phase schematic --input audit-input-2605 --output work-2605/schematic --config altium-audit-2605.config.json
          rc=$?
          set -e
          python - "work-2605/schematic/phase_receipt.json" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          path, raw_rc = Path(sys.argv[1]), int(sys.argv[2])
          if not path.is_file():
              raise SystemExit(f"missing schematic phase receipt: {path}")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          if receipt.get("schema") != "altium-audit-e2e-phase/v2" or receipt.get("phase") != "SCHEMATIC":
              raise SystemExit("invalid schematic phase receipt schema/phase")
          status = receipt.get("status")
          if status not in {"PASS", "BLOCKED"}:
              raise SystemExit(f"unauthorized schematic status: {status!r}")
          if (status == "PASS" and raw_rc != 0) or (status == "BLOCKED" and raw_rc == 0):
              raise SystemExit(f"receipt/exit mismatch: status={status} rc={raw_rc}")
          if status == "PASS":
              gates = receipt.get("evidence", {}).get("required_gates", {})
              if any(gates.get(k) != "VERIFIED" for k in ("G0_INTAKE", "G1_PARSE", "G2_COMPILE", "G3_CONNECTIVITY")):
                  raise SystemExit("PASS receipt lacks verified G0-G3 gates")
              if receipt.get("evidence", {}).get("required_unknown_findings"):
                  raise SystemExit("PASS receipt contains unresolved required schematic findings")
              print("SCHEMATIC_GATE_CONFORMANCE_PASS; DESIGN_STATUS=PASS")
          else:
              print("SCHEMATIC_GATE_CONFORMANCE_PASS; DESIGN_STATUS=BLOCKED")
              print(json.dumps(receipt.get("evidence", {}).get("required_unknown_findings", []), sort_keys=True))
          PY
      - name: Upload schematic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: qi9-2605-schematic-gate
          path: work-2605/schematic
          if-no-files-found: error
          retention-days: 7


  pdf-vector-ir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install deterministic PDF/SVG intake dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install pymupdf pytest
      - name: Export vector PDF pages to SVG evidence
        run: python tools/pdf-schematic/export_svg_evidence.py "[QI9-2605-A01] Module ADC.pdf" --out work/svg-evidence
      - name: Normalize SVG geometry
        shell: bash
        run: |
          python -m pytest -q tests/test_pdf_svg_geometry.py tests/test_pdf_normalized_ir.py tests/test_pdf_connectivity_candidates.py
          mkdir -p work/normalized-svg
          for svg in work/svg-evidence/page*.svg; do
            [ -f "$svg" ] || continue
            name="$(basename "$svg" .svg)"
            python tools/pdf-schematic/normalize_svg_geometry.py "$svg" --out "work/normalized-svg/$name.json"
          done
          test "$(find work/normalized-svg -name '*.json' | wc -l)" -eq 16
      - name: Extract PDF text and vector primitives
        run: python tools/pdf-schematic/extract_primitives.py "[QI9-2605-A01] Module ADC.pdf" --out work/pdf-primitives/primitives.json
      - name: Build provenance-preserving Normalized Schematic IR
        run: python tools/pdf-schematic/build_normalized_ir.py --svg-dir work/normalized-svg --primitives work/pdf-primitives/primitives.json --out work/ir/normalized_schematic_ir.json
      - name: Build conservative vector connectivity candidates
        run: python tools/pdf-schematic/build_connectivity_candidates.py --ir work/ir/normalized_schematic_ir.json --out work/ir/connectivity_candidates.json
      - name: Enforce electrical-resolution boundary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("work/ir/normalized_schematic_ir.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          graph=json.loads(Path("work/ir/connectivity_candidates.json").read_text(encoding="utf-8"))
          summary={"schema":d["schema"],"status":d["status"],"page_count":d["page_count"],"primitive_count":d["primitive_count"],"symbol_count":d["symbol_count"],"resolved_pin_count":d["resolved_pin_count"],"connectivity_edge_count":d["connectivity_edge_count"],"candidate_segments":graph["segment_count"],"candidate_nodes":graph["node_count"],"candidate_edges":graph["edge_count"],"collinear_overlap_pairs":len(graph["collinear_overlap_pairs"]),"graph_status":graph["status"],"unknown_reasons":d["unknown_reasons"]}
          print(json.dumps(summary,indent=2))
          Path("work/ir/run-summary.json").write_text(json.dumps(summary,indent=2)+"\\n",encoding="utf-8")
          if d["status"] != "BLOCKED_SYMBOL_PIN_CONNECTIVITY_UNRESOLVED":
              raise SystemExit("Unexpected status: IR must not claim electrical PASS without symbol/pin resolver and independent golden-netlist comparison")
          PY
      - name: Upload PDF IR evidence
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: qi9-2605-pdf-normalized-ir
          path: work/
          if-no-files-found: error
          retention-days: 7
