name: qi9-2605-schematic-routing

on:
  push:
    paths:
      - 'audit-input-2605/**'
      - 'tools/altium-audit/**'
      - 'altium-audit-2605.config.json'
      - '.github/workflows/qi9-2605-schematic-routing.yml'
  pull_request:
    paths:
      - 'audit-input-2605/**'
      - 'tools/altium-audit/**'
      - 'altium-audit-2605.config.json'
      - 'altium-audit-2605.placement-authority.json'
      - 'tests/**'
      - '.github/workflows/qi9-2605-schematic-routing.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r tools/altium-audit/requirements.txt
      - run: python -m pip install pytest
      - name: Semantic regression tests
        run: python -m pytest -q tests/test_schematic_semantics.py
      - name: Audit QI9-2605
        run: |
          set +e
          python tools/altium-audit/audit_kit.py --input audit-input-2605 --output work-2605/kit --config altium-audit-2605.config.json --repair --max-retries 3
          rc=$?
          echo "audit_rc=$rc"
          echo "=== findings ==="
          cat work-2605/kit/audit-initial/findings.json || true
          echo "=== schematic evidence ==="
          cat work-2605/kit/audit-initial/schematic-evidence.json || true
          echo "=== placement plan ==="
          cat work-2605/kit/placement-routing-plan.json || true
          cat work-2605/kit/anchor-first-placement-plan.json || true
          echo "=== summary ==="
          cat work-2605/kit/summary.json || true
          exit $rc
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-audit
          path: work-2605/kit
          if-no-files-found: warn

# e2e-kickoff 2026-10-02
# 2026-10-03: rerun after layer-aware placement and SMAJ semantic fixes
