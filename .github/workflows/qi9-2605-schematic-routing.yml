# Re-run the 2605 audit against the current authoritative input set (2026-10-29).
name: qi9-2605-schematic-gate-conformance

on:
  push:
    paths:
      - 'audit-input-2605/**'
      - 'tools/altium-audit/**'
      - 'altium-audit-2605.config.json'
      - '.github/workflows/qi9-2605-schematic-routing.yml'
  pull_request:
    paths:
      - 'audit-input-2605/**'
      - 'tools/altium-audit/**'
      - 'altium-audit-2605.config.json'
      - 'altium-audit-2605.placement-authority.json'
      - 'tests/**'
      - '.github/workflows/qi9-2605-schematic-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schematic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r tools/altium-audit/requirements.txt
      - run: python -m pip install pytest
      - name: Semantic and phase-policy regression tests
        run: python -m pytest -q tests/test_part_identity.py tests/test_schematic_semantics.py tests/test_e2e_phase_policy.py
      - name: Run schematic phase and classify truthful design status
        shell: bash
        run: |
          set +e
          python tools/altium-audit/e2e_phase.py --phase schematic --input audit-input-2605 --output work-2605/schematic --config altium-audit-2605.config.json
          rc=$?
          set -e
          python - "work-2605/schematic/phase_receipt.json" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          path, raw_rc = Path(sys.argv[1]), int(sys.argv[2])
          if not path.is_file():
              raise SystemExit(f"missing schematic phase receipt: {path}")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          if receipt.get("schema") != "altium-audit-e2e-phase/v2" or receipt.get("phase") != "SCHEMATIC":
              raise SystemExit("invalid schematic phase receipt schema/phase")
          status = receipt.get("status")
          if status not in {"PASS", "BLOCKED"}:
              raise SystemExit(f"unauthorized schematic status: {status!r}")
          if (status == "PASS" and raw_rc != 0) or (status == "BLOCKED" and raw_rc == 0):
              raise SystemExit(f"receipt/exit mismatch: status={status} rc={raw_rc}")
          if status == "PASS":
              gates = receipt.get("evidence", {}).get("required_gates", {})
              if any(gates.get(k) != "VERIFIED" for k in ("G0_INTAKE", "G1_PARSE", "G2_COMPILE", "G3_CONNECTIVITY")):
                  raise SystemExit("PASS receipt lacks verified G0-G3 gates")
              if receipt.get("evidence", {}).get("required_unknown_findings"):
                  raise SystemExit("PASS receipt contains unresolved required schematic findings")
              print("SCHEMATIC_GATE_CONFORMANCE_PASS; DESIGN_STATUS=PASS")
          else:
              print("SCHEMATIC_GATE_CONFORMANCE_PASS; DESIGN_STATUS=BLOCKED")
              print(json.dumps(receipt.get("evidence", {}).get("required_unknown_findings", []), sort_keys=True))
          PY
      - name: Upload schematic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-schematic-gate
          path: work-2605/schematic
          if-no-files-found: error
          retention-days: 90


  pdf-backend-one-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install specialist PDF schematic backend
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
          python -m pip install 'git+https://github.com/sphrd/SchematicNetlist.git'
          python -m pip install opencv-python-headless pytesseract numpy pymupdf
      - name: Extract reusable PDF vector/text primitives (no OCR, no inferred connectivity)
        shell: bash
        run: |
          mkdir -p work/pdf-primitives
          python tools/pdf-schematic/extract_primitives.py "[QI9-2605-A01] Module ADC.pdf" --out work/pdf-primitives/primitives.json > work/pdf-primitives/summary.stdout.json
      - name: Backend health check
        run: schematic-netlist doctor
      - name: Analyze uploaded QI9 PDF
        shell: bash
        run: |
          mkdir -p work/pdf-backend
          set +e
          schematic-netlist analyze "[QI9-2605-A01] Module ADC.pdf" -o work/pdf-backend --no-excel --no-spice --no-cache > work/backend.stdout.txt 2> work/backend.stderr.txt
          rc=$?
          set -e
          printf '%s\n' "$rc" > work/backend.exit_code
          exit "$rc"
      - name: Build truthful run manifest
        if: always()
        shell: bash
        run: |
          mkdir -p work
          python - <<'PY'
          import json, hashlib, re, traceback
          from pathlib import Path
          root = Path("work")
          try:
              rc = int((root / "backend.exit_code").read_text().strip())
          except Exception:
              rc = None
          quality = {"netlist_found": False, "part_count": 0, "net_count": 0,
                     "unnamed_pin_count": None, "warnings_dropped_wire_ends": None,
                     "quality_checks_error": None}
          try:
              netlists = list((root / "pdf-backend").glob("*_netlist.json"))
              quality["netlist_found"] = bool(netlists)
              if netlists:
                  data = json.loads(netlists[0].read_text(encoding="utf-8"))
                  parts = data.get("parts", [])
                  nets = data.get("nets", [])
                  quality["part_count"] = len(parts) if hasattr(parts, "__len__") else 0
                  quality["net_count"] = len(nets) if hasattr(nets, "__len__") else 0
                  unknown = 0
                  for part in parts if isinstance(parts, list) else []:
                      pins = part.get("pins", []) if isinstance(part, dict) else []
                      if isinstance(pins, dict):
                          pins = list(pins.values())
                      for pin in pins if isinstance(pins, list) else []:
                          if isinstance(pin, dict) and (not pin.get("number") or not pin.get("net")):
                              unknown += 1
                  quality["unnamed_pin_count"] = unknown
              quality["warnings_dropped_wire_ends"] = 0
              logs = list((root / "pdf-backend").glob("*_engine_log.txt"))
              for log in logs:
                  for line in log.read_text(encoding="utf-8", errors="replace").splitlines():
                      m = re.search(r"(\\d+) wire end\\(s\\).*\\(dropped\\)", line)
                      if m:
                          quality["warnings_dropped_wire_ends"] += int(m.group(1))
          except Exception as exc:
              quality["quality_checks_error"] = f"{type(exc).__name__}: {exc}"
          quality_pass = (rc == 0 and quality["netlist_found"] and
                          quality["part_count"] >= 10 and quality["net_count"] < 1000 and
                          quality["warnings_dropped_wire_ends"] == 0 and
                          quality["unnamed_pin_count"] == 0)
          primitive_path = root / "pdf-primitives" / "primitives.json"
          primitive_summary = {"found": primitive_path.is_file(), "sha256": None, "bytes": 0}
          if primitive_path.is_file():
              raw = primitive_path.read_bytes()
              primitive_summary.update({"sha256": hashlib.sha256(raw).hexdigest(), "bytes": len(raw)})
              try:
                  p = json.loads(raw)
                  primitive_summary["totals"] = p.get("totals", {})
                  primitive_summary["policy"] = p.get("policy", {})
              except Exception as exc:
                  primitive_summary["parse_error"] = f"{type(exc).__name__}: {exc}"
          outputs = [{"path": str(p), "bytes": p.stat().st_size} for p in sorted(root.rglob("*"))
                     if p.is_file() and p.name != "run_manifest.json"]
          manifest = {
              "schema": "qi9-pdf-backend-run/v2",
              "input": "[QI9-2605-A01] Module ADC.pdf",
              "backend": "SchematicNetlist",
              "backend_exit_code": rc,
              "status": ("EXTRACTED_UNVERIFIED" if quality_pass else
                         ("BLOCKED_BACKEND_FAILURE" if rc != 0 else "BLOCKED_EXTRACTION_QUALITY")),
              "quality": quality,
              "pdf_primitives": primitive_summary,
              "kicad_schematic_generated": False,
              "netlist_connectivity_independently_verified": False,
              "outputs": outputs,
          }
          (root / "run_manifest.json").write_text(json.dumps(manifest, indent=2) + "\\n")
          print(json.dumps(manifest, indent=2))
          PY
      - name: Upload PDF backend outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-pdf-backend-one-pass
          path: work/
          if-no-files-found: warn
          retention-days: 90

  native-schdoc-to-kicad:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Confirm authoritative 2605 source exists
        shell: bash
        run: |
          test -s 'audit-input-2605/QI9-2605-A01.SchDoc'
          sha256sum 'audit-input-2605/QI9-2605-A01.SchDoc'
      - name: Convert native Altium SchDoc to KiCad
        shell: bash
        run: |
          mkdir -p work-native/kicad work-native/svg work-native/evidence
          go run github.com/rveen/golib/formats/altium/cmd/schconv@latest -kicad -out work-native/kicad 'audit-input-2605/QI9-2605-A01.SchDoc' 2>&1 | tee work-native/evidence/kicad-conversion.log
          go run github.com/rveen/golib/formats/altium/cmd/schconv@latest -svg -out work-native/svg 'audit-input-2605/QI9-2605-A01.SchDoc' 2>&1 | tee work-native/evidence/svg-conversion.log
      - name: Validate with KiCad CLI and export connectivity netlist
        continue-on-error: true
        shell: bash
        run: |
          sudo apt-get update
          # Ubuntu's archive package can ship a CLI build without the schematic ERC
          # subcommand. Use the maintained KiCad 9 release PPA so validation commands
          # match the current schematic format emitted by schconv.
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli version > work-native/evidence/kicad-cli-version.txt
          kicad-cli sch --help > work-native/evidence/kicad-sch-help.txt
          grep -q 'erc' work-native/evidence/kicad-sch-help.txt || { echo 'Installed KiCad CLI lacks schematic ERC support' >&2; exit 2; }
          set +e
          kicad-cli sch erc --output work-native/evidence/erc.rpt work-native/kicad/QI9-2605-A01.kicad_sch > work-native/evidence/erc.stdout.txt 2> work-native/evidence/erc.stderr.txt
          erc_rc=$?
          kicad-cli sch export netlist --output work-native/evidence/QI9-2605-A01.net work-native/kicad/QI9-2605-A01.kicad_sch > work-native/evidence/netlist.stdout.txt 2> work-native/evidence/netlist.stderr.txt
          net_rc=$?
          set -e
          printf '%s\\n' "$erc_rc" > work-native/evidence/erc.exit_code
          printf '%s\\n' "$net_rc" > work-native/evidence/netlist.exit_code
          test -s work-native/evidence/erc.rpt || true
          test -s work-native/evidence/QI9-2605-A01.net || true
      - name: Validate KiCad output structure
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib
          out = Path("work-native/kicad")
          files = sorted(out.glob("*.kicad_sch"))
          if len(files) != 1 or files[0].stat().st_size < 1000:
              raise SystemExit(f"BLOCKED: expected one nontrivial .kicad_sch; found {[(p.name,p.stat().st_size) for p in files]}")
          p = files[0]
          data = p.read_text(encoding="utf-8", errors="replace")
          depth = 0
          quoted = escaped = False
          for ch in data:
              if quoted:
                  if escaped: escaped = False
                  elif ch == "\\": escaped = True
                  elif ch == '"': quoted = False
                  continue
              if ch == '"': quoted = True
              elif ch == '(': depth += 1
              elif ch == ')':
                  depth -= 1
                  if depth < 0: raise SystemExit("BLOCKED: unbalanced closing parenthesis")
          if quoted or depth != 0:
              raise SystemExit(f"BLOCKED: unbalanced KiCad S-expression (depth={depth}, quoted={quoted})")
          counts = {k: len(re.findall(r"\(" + k + r"(?=\s|\))", data)) for k in ["symbol", "wire", "label", "global_label", "junction", "no_connect", "sheet"]}
          manifest = {
            "schema": "qi9-native-schdoc-to-kicad/v1",
            "source": "audit-input-2605/QI9-2605-A01.SchDoc",
            "source_sha256": hashlib.sha256(Path("audit-input-2605/QI9-2605-A01.SchDoc").read_bytes()).hexdigest(),
            "output": str(p), "output_bytes": p.stat().st_size,
            "output_sha256": hashlib.sha256(p.read_bytes()).hexdigest(),
            "counts": counts, "sexpr_balanced": True,
            "kicad_cli_erc_run": Path("work-native/evidence/erc.exit_code").exists(), "kicad_cli_erc_exit_code": Path("work-native/evidence/erc.exit_code").read_text().strip() if Path("work-native/evidence/erc.exit_code").exists() else None, "kicad_netlist_exported": Path("work-native/evidence/QI9-2605-A01.net").is_file() and Path("work-native/evidence/QI9-2605-A01.net").stat().st_size > 0, "connectivity_equivalence_verified": False,
            "status": "CONVERTED_UNVERIFIED"
          }
          Path("work-native/evidence/conversion_manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          if counts["symbol"] == 0 or counts["wire"] == 0:
              raise SystemExit("BLOCKED: output lacks symbols or wires.")
          PY
      - name: Upload native KiCad schematic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-native-kicad-schematic
          path: work-native/
          if-no-files-found: error
          retention-days: 90
