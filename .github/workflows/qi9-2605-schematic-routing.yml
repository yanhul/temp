# Re-run the 2605 audit against the current authoritative input set (2026-10-29).
name: qi9-2605-schematic-gate-conformance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schematic-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r tools/altium-audit/requirements.txt
      - run: python -m pip install pytest
      - name: Semantic and phase-policy regression tests
        run: python -m pytest -q tests/test_part_identity.py tests/test_schematic_semantics.py tests/test_e2e_phase_policy.py
      - name: Run schematic phase and classify truthful design status
        shell: bash
        run: |
          set +e
          python tools/altium-audit/e2e_phase.py --phase schematic --input audit-input-2605 --output work-2605/schematic --config altium-audit-2605.config.json
          rc=$?
          set -e
          python - "work-2605/schematic/phase_receipt.json" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          path, raw_rc = Path(sys.argv[1]), int(sys.argv[2])
          if not path.is_file():
              raise SystemExit(f"missing schematic phase receipt: {path}")
          receipt = json.loads(path.read_text(encoding="utf-8"))
          if receipt.get("schema") != "altium-audit-e2e-phase/v2" or receipt.get("phase") != "SCHEMATIC":
              raise SystemExit("invalid schematic phase receipt schema/phase")
          status = receipt.get("status")
          if status not in {"PASS", "BLOCKED"}:
              raise SystemExit(f"unauthorized schematic status: {status!r}")
          if (status == "PASS" and raw_rc != 0) or (status == "BLOCKED" and raw_rc == 0):
              raise SystemExit(f"receipt/exit mismatch: status={status} rc={raw_rc}")
          if status == "PASS":
              gates = receipt.get("evidence", {}).get("required_gates", {})
              if any(gates.get(k) != "VERIFIED" for k in ("G0_INTAKE", "G1_PARSE", "G2_COMPILE", "G3_CONNECTIVITY")):
                  raise SystemExit("PASS receipt lacks verified G0-G3 gates")
              if receipt.get("evidence", {}).get("required_unknown_findings"):
                  raise SystemExit("PASS receipt contains unresolved required schematic findings")
              print("SCHEMATIC_GATE_CONFORMANCE_PASS; DESIGN_STATUS=PASS")
          else:
              print("SCHEMATIC_GATE_CONFORMANCE_PASS; DESIGN_STATUS=BLOCKED")
              print(json.dumps(receipt.get("evidence", {}).get("required_unknown_findings", []), sort_keys=True))
          PY
      - name: Upload schematic-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-schematic-gate
          retention-days: 3
          path: work-2605/schematic
          if-no-files-found: error
          retention-days: 90


  pdf-backend-one-pass:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install specialist PDF schematic backend
        run: python -m pip install 'git+https://github.com/sphrd/SchematicNetlist.git'
      - name: Backend health check
        run: schematic-netlist doctor
      - name: Analyze uploaded QI9 PDF
        shell: bash
        run: |
          mkdir -p work/pdf-backend
          set +e
          schematic-netlist analyze "[QI9-2605-A01] Module ADC.pdf" -o work/pdf-backend --no-excel --no-spice --no-cache > work/backend.stdout.txt 2> work/backend.stderr.txt
          rc=$?
          set -e
          printf '%s\\n' "$rc" > work/backend.exit_code
          exit "$rc"
      - name: Build truthful run manifest
        if: always()
        run: |
          mkdir -p work
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("work")
          try:
              rc = int((root / "backend.exit_code").read_text().strip())
          except Exception:
              rc = None
          outputs = [{"path": str(p), "bytes": p.stat().st_size} for p in sorted(root.rglob("*")) if p.is_file() and p.name != "run_manifest.json"]
          manifest = {
              "schema": "qi9-pdf-backend-run/v1",
              "input": "[QI9-2605-A01] Module ADC.pdf",
              "backend": "SchematicNetlist",
              "backend_exit_code": rc,
              "status": "EXTRACTED_UNVERIFIED" if rc == 0 else "BLOCKED_BACKEND_FAILURE",
              "kicad_schematic_generated": False,
              "netlist_connectivity_independently_verified": False,
              "outputs": outputs,
          }
          (root / "run_manifest.json").write_text(json.dumps(manifest, indent=2) + "\\n")
          print(json.dumps(manifest, indent=2))
          PY
      - name: Upload PDF backend outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qi9-2605-pdf-backend-one-pass
          retention-days: 3
          path: work/
          if-no-files-found: warn
          retention-days: 90
